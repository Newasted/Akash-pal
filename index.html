<style>
  :root{
    --void:#07050d; --obsidian:#0d0918; --night:#150d2b; --royal:#2a1561; --violet:#7c4dff; --indigo:#5b6bff;
    --glow:#a78bfa; --silver:#ece9f5; --mute:#a59fbd; --line:rgba(167,139,250,.18);
    --display:'Anton','Impact','Arial Narrow',sans-serif;
    --body:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:84px}
  body{font-family:var(--body);background:var(--void);color:var(--silver);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  img,svg{display:block;max-width:100%}
  .wrap{width:min(1160px,92%);margin-inline:auto}
  section{position:relative;padding:96px 0}

  /* ambient aura */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 80% -10%,#1d0f45 0%,transparent 55%),radial-gradient(90% 70% at 0% 100%,#170a36 0%,transparent 60%),var(--void)}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
  .b1{width:460px;height:460px;background:#4a1fb8;top:-120px;right:-80px}
  .b2{width:380px;height:380px;background:#2b2fa8;bottom:5%;left:-120px;animation-delay:-6s;opacity:.35}
  .b3{width:300px;height:300px;background:#6d28d9;top:45%;right:10%;animation-delay:-11s;opacity:.22}
  @keyframes drift{to{transform:translate3d(40px,60px,0) scale(1.15)}}
  .grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}

  /* nav */
  header{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(7,5,13,.72);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:.78rem;white-space:nowrap}
  .brand small{color:var(--glow);font-weight:500}
  .links{display:flex;gap:6px;align-items:center}
  .links a.l{padding:8px 14px;border-radius:99px;font-size:.88rem;color:var(--mute);transition:.25s}
  .links a.l:hover{color:#fff;background:rgba(124,77,255,.15)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:99px;font-weight:600;font-size:.9rem;border:1px solid transparent;transition:transform .25s,box-shadow .25s,background .25s;color:#fff;background:linear-gradient(135deg,var(--violet),var(--indigo));box-shadow:0 8px 30px -8px rgba(124,77,255,.8)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px -8px rgba(124,77,255,.95)}
  .btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--silver)}
  .btn.ghost:hover{background:rgba(124,77,255,.14);border-color:var(--glow)}
  .burger{display:none;background:none;border:1px solid var(--line);border-radius:12px;width:44px;height:44px;color:var(--silver);align-items:center;justify-content:center}
  .mobile{display:none}
  @media(max-width:900px){
    .links{display:none}
    .burger{display:inline-flex}
    .brand span.full{display:none}
    .mobile{display:block;max-height:0;overflow:hidden;transition:max-height .4s ease;background:rgba(10,7,20,.97)}
    .mobile.open{max-height:420px;border-bottom:1px solid var(--line)}
    .mobile a{display:block;padding:15px 5%;border-top:1px solid var(--line);color:var(--silver)}
    .mobile .btn{margin:16px 5%;display:flex}
  }

  /* hero */
  .hero{padding-top:140px;min-height:100vh;display:flex;align-items:center}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--glow);border:1px solid var(--line);padding:7px 14px;border-radius:99px;background:rgba(124,77,255,.08)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
  h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(3rem,8vw,6.2rem);line-height:.95;letter-spacing:.01em;margin:22px 0}
  h1 .g{background:linear-gradient(100deg,#c4b5fd,#7c4dff 45%,#5b6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .o{color:transparent;-webkit-text-stroke:1.5px var(--silver)}
  .lead{color:var(--mute);max-width:520px;font-size:1.08rem}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
  .stats{display:flex;gap:28px;margin-top:42px;flex-wrap:wrap}
  .stats b{display:block;font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:.04em;color:#fff}
  .stats span{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

  /* flip card */
  .card-zone{display:flex;flex-direction:column;align-items:center;gap:20px}
  .scene{width:min(400px,88vw);aspect-ratio:4/5.35;perspective:1400px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
  .scene.drag{cursor:grabbing}
  .flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
  .scene.drag .flipper{transition:none}
  .face{position:absolute;inset:0;border-radius:26px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(167,139,250,.45);box-shadow:0 0 0 6px rgba(124,77,255,.07),0 40px 90px -30px rgba(91,70,255,.65),0 0 70px -10px rgba(124,77,255,.35)}
  .front{background:linear-gradient(160deg,#150d2b,#07050d);padding:14px;display:flex;flex-direction:column;gap:12px}
  .back{transform:rotateY(180deg);background:radial-gradient(90% 60% at 50% 0%,#241052,#07050d 70%);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  .scene:not(.flipped) .back{pointer-events:none}
  .scene.flipped .front{pointer-events:none}

  .toolbar{display:flex;justify-content:space-between;align-items:center;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:0 4px}
  .toolbar .tags{display:flex;gap:6px}
  .chip{border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:rgba(124,77,
